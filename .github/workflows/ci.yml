name: CI TupleTrace

on:
  push:
    branches: [cheima]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Compiler, tester et assembler le WAR
        run: sh ./mvnw -B -ntp clean verify
      - name: Vérifier le déploiement HTTPS sur WildFly 42
        env:
          WILDFLY_VERSION: 42.0.0.Final
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/wildfly.zip"
          base="https://repo.maven.apache.org/maven2/org/wildfly/wildfly-dist/$WILDFLY_VERSION"
          curl --fail --silent --show-error --retry 3 "$base/wildfly-dist-$WILDFLY_VERSION.zip" -o "$archive"
          echo "3162d4ce32d26cefdd814e6dfe53670645a78945cdd6a68b69e26bb127241fd6  $archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP"
          server="$RUNNER_TEMP/wildfly-$WILDFLY_VERSION"
          deployments="$server/standalone/deployments"
          TT_TEST_AUDITEUR=$(openssl rand -hex 24)
          TT_TEST_DESTINATAIRE=$(openssl rand -hex 24)
          export TT_TEST_AUDITEUR TT_TEST_DESTINATAIRE
          "$server/bin/add-user.sh" -s -a -u ci-auditeur -p "$TT_TEST_AUDITEUR" -g AUDITEUR >/dev/null
          "$server/bin/add-user.sh" -s -a -u ci-destinataire -p "$TT_TEST_DESTINATAIRE" -g DESTINATAIRE >/dev/null
          cp tupletrace-api/target/tupletrace.war "$deployments/"
          "$server/bin/standalone.sh" -b 127.0.0.1 > "$RUNNER_TEMP/wildfly.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..120}; do
            test ! -f "$deployments/tupletrace.war.failed"
            kill -0 "$pid"
            if test -f "$deployments/tupletrace.war.deployed"; then break; fi
            sleep 1
          done
          test -f "$deployments/tupletrace.war.deployed"
          python3 ci/check-wildfly.py

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks sur tout l'historique
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:e4037a313035c932d6b14b934edc5da9bbf6212b52da0b94870e1448ed4b8e2b \
            git --redact=100 --log-opts=--all /repo

  sca:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.TT_SECURITY_ANALYSIS == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '25'
      - name: OWASP Dependency-Check
        run: |
          sh ./mvnw -B -ntp -DskipTests install
          sh ./mvnw -B -ntp org.owasp:dependency-check-maven:12.2.2:aggregate -DfailBuildOnCVSS=7

  sast:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.TT_SECURITY_ANALYSIS == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: github/codeql-action/init@1a818fd5f97ed0ee9a823421bd5b171add01227f # v4.36.2
        with:
          languages: java-kotlin
          build-mode: manual
      - run: sh ./mvnw -B -ntp -DskipTests clean package
      - uses: github/codeql-action/analyze@1a818fd5f97ed0ee9a823421bd5b171add01227f # v4.36.2
